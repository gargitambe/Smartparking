<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Confirmed | SmartPark</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="index.html"><span class="brand-car" aria-hidden="true"><img src="images/smartpark-car-logo.png" alt="" /></span> SmartPark</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="my-bookings.html">My Bookings</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="form-wrap"><div class="form-card text-center"><div class="feature-icon" style="margin:auto;background:#def7e9">✓</div><h1>Booking Confirmed!</h1><p class="muted">Your SmartPark reservation has been recorded successfully.<span id="paymentNote" class="payment-note"></span></p><div id="details" class="card" style="text-align:left"></div><div class="hero-actions" style="justify-content:center"><a class="btn" href="my-bookings.html">View My Bookings</a><a class="btn light" href="dashboard.html">Dashboard</a></div></div></section></main><script src="js/app.js"></script><script>const b=JSON.parse(localStorage.getItem('smartparkBooking')||'null');if(b?.paymentMethod==='Pay at Parking')document.getElementById('paymentNote').textContent=' Please pay the parking attendant when you arrive.';document.getElementById('details').innerHTML=b?`<div class="mini-list"><div class="mini-item"><span>Booking ID</span><b>#${b.bookingId}</b></div><div class="mini-item"><span>Parking Slot</span><b>${escapeHtml(b.slot?.slotNumber||'-')}</b></div><div class="mini-item"><span>Date</span><b>${escapeHtml(b.bookingDate)}</b></div><div class="mini-item"><span>Time</span><b>${escapeHtml(b.startTime)} - ${escapeHtml(b.endTime)}</b></div><div class="mini-item"><span>Amount</span><b>₹${b.amount}</b></div><div class="mini-item"><span>Payment option</span><b>${escapeHtml(b.paymentMethod||'Payment pending')}</b></div><div class="mini-item"><span>Payment status</span><b>${escapeHtml(b.paymentStatus||'PAID')}</b></div><div class="mini-item"><span>Transaction</span><b>${escapeHtml(b.transactionId||'DEMO')}</b></div></div>`:'<p>No booking found.</p>';</script></body></html>
