<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bookings | SmartPark</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="index.html"><span class="brand-car" aria-hidden="true"><img src="images/smartpark-car-logo.png" alt="" /></span> SmartPark</a><button class="menu-btn" onclick="toggleMenu()">☰</button><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="locations.html">Locations</a><a href="parking.html">Find Parking</a><a class="active" href="my-bookings.html">My Bookings</a><a href="profile.html">Profile</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">BOOKING HISTORY</div><h1>My Bookings</h1><p>View your current and previous parking reservations.</p></div><a class="btn" href="parking.html">+ New Booking</a></div><div id="list"></div></section></main><script src="js/app.js"></script><script>if(!requireLogin()){};async function load(){const u=getUser(),box=document.getElementById('list');try{const d=await request('/bookings/user/'+u.userId);if(!d.length){box.innerHTML='<div class="empty"><div class="emoji">🎫</div><h3>No bookings yet</h3><p>Find a parking location and make your first reservation.</p><a class="btn" href="parking.html">Find Parking</a></div>';return;}box.innerHTML='<div class="table-wrap"><table><tr><th>ID</th><th>Location / Slot</th><th>Date</th><th>Time</th><th>Amount</th><th>Payment</th><th>Status</th></tr>'+d.map(b=>`<tr><td>#${b.bookingId}</td><td>${escapeHtml(b.slot?.location?.locationName||'Parking')}<br><b>${escapeHtml(b.slot?.slotNumber||'-')}</b></td><td>${b.bookingDate}</td><td>${b.startTime} - ${b.endTime}</td><td>₹${b.amount}</td><td>${escapeHtml(b.paymentStatus||'PENDING')}</td><td><span class="status ${b.bookingStatus==='CONFIRMED'?'ok':b.bookingStatus==='CANCELLED'?'bad':'warn'}">${escapeHtml(b.bookingStatus)}</span></td></tr>`).join('')+'</table></div>';}catch(e){box.innerHTML='<div class="empty"><p>'+escapeHtml(e.message)+'</p></div>';}}load();</script></body></html>
