<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | SmartPark</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="brand" href="index.html"><span class="brand-car" aria-hidden="true"><img src="images/smartpark-car-logo.png" alt="" /></span> SmartPark</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="my-bookings.html">My Bookings</a><a class="active" href="profile.html">Profile</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="form-wrap"><div class="form-card"><div class="text-center"><div class="feature-icon" style="margin:auto">👤</div><h1>My Profile</h1><p class="muted">Update your contact and vehicle details.</p></div><form id="profileForm"><label>Name<input id="name" name="name" required></label><label>Email<input id="email" name="email" type="email" disabled></label><label>Mobile<input id="mobile" name="mobile"></label><label>Vehicle Number<input id="vehicleNumber" name="vehicleNumber"></label><label>Vehicle Type<select id="vehicleType" name="vehicleType"><option>Car</option><option>Bike</option><option>SUV</option></select></label><button class="btn">Save Changes</button><p class="msg"></p></form></div></section></main><script src="js/app.js"></script><script>if(!requireLogin()){};const u=getUser(),f=document.getElementById('profileForm');['name','email','mobile','vehicleNumber','vehicleType'].forEach(k=>document.getElementById(k).value=u?.[k]||'');f.addEventListener('submit',async e=>{e.preventDefault();try{const updated=await request('/users/'+u.userId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value,mobile:f.mobile.value,vehicleNumber:f.vehicleNumber.value,vehicleType:f.vehicleType.value,status:u.status})});saveUser(updated);f.querySelector('.msg').textContent='Profile updated successfully.';f.querySelector('.msg').className='msg success-msg';}catch(x){f.querySelector('.msg').textContent=x.message;}});</script></body></html>
