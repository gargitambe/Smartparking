<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Slots | SmartPark</title><link rel="stylesheet" href="../css/style.css"></head><body><nav class="admin-nav"><a class="brand" href="../index.html"><span class="brand-car" aria-hidden="true"><img src="../images/smartpark-car-logo.png" alt="" /></span> SmartPark Admin</a><button class="menu-btn" onclick="toggleMenu()">☰</button><div class="nav-links"><a href="admin-dashboard.html">Dashboard</a><a href="locations.html">Locations</a><a class="active" href="slots.html">Slots</a><a href="users.html">Users</a><a href="bookings.html">Bookings</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">ADMIN • SLOTS</div><h1>Manage Parking Slots</h1><p>Create slots under a selected parking location.</p></div></div><div class="panel"><div class="two-col"><label>Location<select id="location"></select></label><label>Slot Number<input id="slotNumber" placeholder="P01"></label></div><div class="two-col"><label>Slot Type<select id="slotType"><option>CAR</option><option>BIKE</option><option>SUV</option><option>EV</option></select></label><div style="display:flex;align-items:end"><button class="btn" onclick="addSlot()">Add Slot</button></div></div><p id="msg" class="msg"></p></div><div style="margin-top:28px" id="table" class="table-wrap"></div></section></main><script src="../js/app.js"></script><script>if(requireAdmin())load();async function load(){try{const [l,s]=await Promise.all([request('/locations'),request('/slots')]);document.getElementById('location').innerHTML=l.map(x=>`<option value="${x.locationId}">${escapeHtml(x.locationName)}</option>`).join('');document.getElementById('table').innerHTML='<table><tr><th>ID</th><th>Location</th><th>Slot</th><th>Type</th><th>Status</th><th>Actions</th></tr>'+s.map(x=>`<tr><td>${x.slotId}</td><td>${escapeHtml(x.location?.locationName||'-')}</td><td><b>${escapeHtml(x.slotNumber)}</b></td><td>${escapeHtml(x.slotType||'-')}</td><td><span class="status ${x.status==='AVAILABLE'?'ok':'bad'}">${escapeHtml(x.status)}</span></td><td><button class="btn danger small" onclick="deleteSlot(${x.slotId})">Delete</button></td></tr>`).join('')+'</table>';}catch(e){document.getElementById('table').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';}}async function deleteSlot(id){if(!confirm('Delete this parking slot?'))return;try{await request('/slots/'+id,{method:'DELETE'});load();}catch(e){alert('Could not delete slot: '+e.message);}}async function addSlot(){try{await request('/slots/location/'+document.getElementById('location').value,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slotNumber:document.getElementById('slotNumber').value,slotType:document.getElementById('slotType').value,status:'AVAILABLE'})});document.getElementById('slotNumber').value='';document.getElementById('msg').textContent='Slot added successfully.';document.getElementById('msg').className='msg success-msg';load();}catch(e){document.getElementById('msg').textContent=e.message;}}</script></body></html>
