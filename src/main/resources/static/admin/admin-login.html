<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | SmartPark</title><link rel="stylesheet" href="../css/style.css"></head><body><nav><a class="brand" href="../index.html"><span class="brand-car" aria-hidden="true"><img src="../images/smartpark-car-logo.png" alt="" /></span> SmartPark</a><div class="nav-links"><a href="../index.html">Back to Website</a></div></nav><main class="container form-wrap"><div class="form-card"><div class="text-center"><div class="feature-icon" style="margin:auto">👨‍💼</div><h1>Admin Login</h1><p class="muted">Access the SmartPark management panel.</p></div><form id="adminLogin"><label>Email<input name="email" type="email" placeholder="admin@smartpark.com" required></label><label>Password<input name="password" type="password" placeholder="Enter password" required></label><button class="btn">Login as Admin</button><p id="msg" class="msg"></p></form><div class="notice" style="margin-top:18px"><b>Demo admin:</b> admin@smartpark.com / admin123</div></div></main><script src="../js/app.js"></script><script>document.getElementById('adminLogin').addEventListener('submit',async e=>{e.preventDefault();try{const r=await request('/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e.target.email.value,password:e.target.password.value})});if(r.role!=='ADMIN')throw new Error('This account is not an admin.');saveUser(r);location.href='admin-dashboard.html';}catch(x){document.getElementById('msg').textContent=x.message;}});</script></body></html>
