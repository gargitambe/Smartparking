<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Users | SmartPark</title><link rel="stylesheet" href="../css/style.css"></head><body><nav class="admin-nav"><a class="brand" href="../index.html"><span class="brand-car" aria-hidden="true"><img src="../images/smartpark-car-logo.png" alt="" /></span> SmartPark Admin</a><button class="menu-btn" onclick="toggleMenu()">☰</button><div class="nav-links"><a href="admin-dashboard.html">Dashboard</a><a href="locations.html">Locations</a><a href="slots.html">Slots</a><a class="active" href="users.html">Users</a><a href="bookings.html">Bookings</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">ADMIN • USERS</div><h1>Manage Users</h1><p>View registered accounts, vehicles and roles.</p></div></div><div class="panel admin-add-panel"><h3>➕ Add User</h3><form id="userForm" class="two-col"><label>Full Name<input name="name" required placeholder="User name"></label><label>Email<input name="email" type="email" required placeholder="user@example.com"></label><label>Password<input name="password" type="password" minlength="4" required placeholder="Temporary password"></label><label>Mobile<input name="mobile" placeholder="Mobile number"></label><label>Vehicle Number<input name="vehicleNumber" placeholder="MH 01 AB 1234"></label><label>Vehicle Type<select name="vehicleType"><option>Car</option><option>Bike</option><option>SUV</option></select></label><div><button class="btn" type="submit">Add User</button><p class="msg"></p></div></form></div><div id="table" class="table-wrap"></div></section></main><script src="../js/app.js"></script><script>if(requireAdmin())load();const userForm=document.getElementById('userForm');userForm.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(userForm).entries());try{await request('/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});userForm.reset();userForm.querySelector('.msg').textContent='User added successfully.';userForm.querySelector('.msg').className='msg success-msg';load();}catch(x){userForm.querySelector('.msg').textContent=x.message;}});async function load(){try{const d=await request('/users');document.getElementById('table').innerHTML='<table><tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Vehicle</th><th>Role</th><th>Status</th><th>Actions</th></tr>'+d.map(x=>`<tr><td>${x.userId}</td><td><b>${escapeHtml(x.name)}</b></td><td>${escapeHtml(x.email)}</td><td>${escapeHtml(x.mobile||'-')}</td><td>${escapeHtml(x.vehicleNumber||'-')}<br>${escapeHtml(x.vehicleType||'')}</td><td>${escapeHtml(x.role)}</td><td><span class="status ${x.status==='ACTIVE'?'ok':'bad'}">${escapeHtml(x.status)}</span></td><td><button class="btn danger small" onclick="deleteUser(${x.userId})">Delete</button></td></tr>`).join('')+'</table>';}catch(e){document.getElementById('table').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';}}async function deleteUser(id){if(!confirm('Delete this user permanently?'))return;try{await request('/users/'+id,{method:'DELETE'});load();}catch(e){alert('Could not delete user: '+e.message);}}</script></body></html>
