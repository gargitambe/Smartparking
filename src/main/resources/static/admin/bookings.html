<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Bookings | SmartPark</title><link rel="stylesheet" href="../css/style.css"></head><body><nav class="admin-nav"><a class="brand" href="../index.html"><span class="brand-car" aria-hidden="true"><img src="../images/smartpark-car-logo.png" alt="" /></span> SmartPark Admin</a><button class="menu-btn" onclick="toggleMenu()">☰</button><div class="nav-links"><a href="admin-dashboard.html">Dashboard</a><a href="locations.html">Locations</a><a href="slots.html">Slots</a><a href="users.html">Users</a><a class="active" href="bookings.html">Bookings</a><a href="reports.html">Reports</a><a href="#" onclick="logout()">Logout</a></div></nav><main class="container"><section class="section"><div class="section-head"><div><div class="eyebrow">ADMIN • BOOKINGS</div><h1>Manage Bookings</h1><p>Review reservations, time, amount, payment and status.</p></div></div><div id="table" class="table-wrap"></div></section></main><script src="../js/app.js"></script><script>if(requireAdmin())load();async function load(){try{const d=await request('/bookings');document.getElementById('table').innerHTML='<table><tr><th>ID</th><th>User</th><th>Slot</th><th>Date</th><th>Time</th><th>Amount</th><th>Payment</th><th>Status</th><th>Actions</th></tr>'+d.map(x=>`<tr><td>#${x.bookingId}</td><td>${escapeHtml(x.user?.name||'-')}<br><small>${escapeHtml(x.user?.email||'')}</small></td><td>${escapeHtml(x.slot?.location?.locationName||'-')}<br><b>${escapeHtml(x.slot?.slotNumber||'-')}</b></td><td>${x.bookingDate}</td><td>${x.startTime}-${x.endTime}</td><td>₹${x.amount}</td><td>${escapeHtml(x.paymentStatus||'-')}<br>${escapeHtml(x.paymentMethod||'')}</td><td><span class="status ${x.bookingStatus==='CONFIRMED'?'ok':x.bookingStatus==='CANCELLED'?'bad':'warn'}">${escapeHtml(x.bookingStatus)}</span></td><td><button class="btn danger small" onclick="deleteBooking(${x.bookingId})">Delete</button></td></tr>`).join('')+'</table>';}catch(e){document.getElementById('table').innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>';}}async function deleteBooking(id){if(!confirm('Delete/cancel this booking?'))return;try{await request('/bookings/'+id,{method:'DELETE'});load();}catch(e){alert('Could not delete booking: '+e.message);}}</script></body></html>
